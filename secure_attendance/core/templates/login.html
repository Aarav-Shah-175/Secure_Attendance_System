<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Attendance - Login</title>
    <style>
        :root {
            --bg-start: #dde8f5;
            --bg-end: #f3f6fb;
            --card-bg: #ffffff;
            --card-border: #dbe3ed;
            --text-main: #0f172a;
            --text-muted: #475569;
            --field-border: #cbd5e1;
            --field-focus: #0b5f78;
            --button-bg: #0b5f78;
            --button-hover: #084f63;
            --shadow: 0 20px 34px -22px rgba(15, 23, 42, 0.5);
            /* New error colors */
            --error-bg: #fef2f2;
            --error-border: #fca5a5;
            --error-text: #991b1b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 12% 8%, #c7d9ef 0%, transparent 27%),
                linear-gradient(155deg, var(--bg-start), var(--bg-end));
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.25rem;
            color: var(--text-main);
        }

        .login-container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 14px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 430px;
            border: 1px solid var(--card-border);
            border-top: 6px solid var(--button-bg);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            text-align: center;
            font-weight: 700;
        }

        .subheading {
            margin: 0 0 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            background: #f8fbff;
            border: 1px solid #dbe8f5;
            border-radius: 10px;
            padding: 0.55rem 0.7rem;
        }

        /* NEW: Error alert message container styling */
        .error-banner {
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 0.75rem 0.85rem;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.25rem;
        }

        input[type="email"],
        .form-input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.78rem 0.85rem;
            margin-bottom: 1rem;
            border: 1px solid var(--field-border);
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background-color: #f8fafc;
        }

        input[type="email"]:focus,
        .form-input:focus {
            outline: none;
            border-color: var(--field-focus);
            box-shadow: 0 0 0 3px rgba(11, 95, 120, 0.15);
            background-color: #ffffff;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .form-input {
            padding-right: 2.75rem;
        }

        .toggle-password {
            position: absolute;
            right: 0.85rem;
            top: 36%;
            transform: translateY(-50%);
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
        }

        .toggle-password:hover {
            color: var(--field-focus);
            background: none;
        }

        .toggle-password.visible .eye-strike {
            display: none;
        }

        button[type="submit"] {
            background-color: var(--button-bg);
            color: white;
            padding: 0.8rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.08s ease;
            margin-top: 0.25rem;
            width: 100%;
        }

        button[type="submit"]:hover {
            background-color: var(--button-hover);
        }

        button[type="submit"]:active {
            transform: translateY(1px);
        }

        br {
            display: none;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1.35rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h2>Login</h2>
        <p class="subheading">Sign in to access your attendance portal</p>

        <!-- NEW: Django error message conditional banner -->
        {% if error %}
        <div class="error-banner">
            <!-- Warning SVG Icon -->
            <svg xmlns="http://w3.org" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Password:</label>
            <div class="password-wrapper">
                <input type="password" name="password" class="form-input" required>
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility()"
                    aria-label="Toggle password visibility">
                    <svg xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <line class="eye-strike" x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>

            <button type="submit">Login</button>
        </form>
    </div>
</body>
<script>
    function togglePasswordVisibility() {
        var passwordInput = document.querySelector('[name="password"]');
        var toggleBtn = document.querySelector('.toggle-password');

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleBtn.classList.add('visible');
        } else {
            passwordInput.type = "password";
            toggleBtn.classList.remove('visible');
        }
    }
</script>

</html>
