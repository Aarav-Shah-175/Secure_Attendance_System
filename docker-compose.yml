services:
  web:
    build:
      context: .
      dockerfile: secure_attendance/Dockerfile
    container_name: secure_attendance_web
    restart: always
    environment:
      - DEBUG=${DEBUG:-False}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-attendance_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-secure_presence_v3_pass}
      - DB_PORT=5432
      - SECURE_PRESENCE_V2_ENABLED=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-production-key-must-be-changed-in-env}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-13-127-69-218.sslip.io}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Secure Attendance System}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-https://13-127-69-218.sslip.io}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/secure_attendance/static
      - media_volume:/app/secure_attendance/embeddings

  db:
    image: pgvector/pgvector:pg16
    container_name: secure_attendance_db
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME:-attendance_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secure_presence_v3_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: secure_attendance_caddy
    restart: always
    environment:
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-13-127-69-218.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
  caddy_data:
  caddy_config:
