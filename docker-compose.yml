services:
  web:
    build:
      context: .
      dockerfile: secure_attendance/Dockerfile
    container_name: secure_attendance_web
    restart: always
    environment:
      - DEBUG=${DEBUG:-True}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-attendance_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-secure_presence_v3_pass}
      - DB_PORT=5432
      - SECURE_PRESENCE_V2_ENABLED=True
      - LIVENESS_VERIFIER_TYPE=new_face_system
      - SECRET_KEY=${SECRET_KEY:-django-insecure-production-key-must-be-changed-in-env}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-192-168-137-1.sslip.io}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Secure Attendance System}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-https://192-168-137-1.sslip.io:8000}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - AES_MASTER_KEY=${AES_MASTER_KEY:-}
      - ATTENDANCE_AGENT_DEV_BYPASS=${ATTENDANCE_AGENT_DEV_BYPASS:-False}
      - ATTENDANCE_AGENT_API_TOKEN=${ATTENDANCE_AGENT_API_TOKEN:-secure_presence_v3_default_token}
      - ATTENDANCE_AGENT_URL=${ATTENDANCE_AGENT_URL:-http://192.168.137.1:5000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./secure_attendance:/app/secure_attendance
      - static_volume:/app/secure_attendance/static
      - media_volume:/app/secure_attendance/embeddings

  db:
    image: pgvector/pgvector:pg16
    container_name: secure_attendance_db
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME:-attendance_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secure_presence_v3_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-attendance_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  static_volume:
  media_volume:
